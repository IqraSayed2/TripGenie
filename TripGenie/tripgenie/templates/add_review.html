{% extends "base.html" %} 
{% block title %}Add Review{% endblock %} 
{% block content %}

<div class="container py-5 fade-in review-form" style="max-width: 600px">
  <h2 class="mb-4 text-center">Share Your Experience</h2>

  {% if messages %} 
  {% for message in messages %}
  <div class="alert alert-success">{{ message }}</div>
  {% endfor %} 
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label">Your Name</label>
      <input type="text" name="name" class="form-control" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Location</label>
      <input type="text" name="location" class="form-control" />
    </div>

    <div class="mb-3">
      <label class="form-label">Rating</label>
      <select name="rating" class="form-select">
        <option value="5">⭐⭐⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="2">⭐⭐</option>
        <option value="1">⭐</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Your Review</label>
      <textarea
        name="comment"
        rows="4"
        class="form-control"
        required
      ></textarea>
    </div>

    <button class="btn btn-primary w-100">Submit Review</button>
  </form>
</div>

{% endblock %}
